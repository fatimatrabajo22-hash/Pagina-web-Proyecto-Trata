<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stradivarius - Fátima Rocha Perujo</title>
    <style>
      /* Estilo minimalista inspirado en Stradivarius */
      body {
        background-color: #f7f7f7; /* Blanco roto / Gris muy suave característico */
        color: #111111;            /* Negro puro para tipografía de alta gama */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      /* Cabecera estilo marca de moda */
      header {
        width: 100%;
        padding: 30px 0;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1.5rem;
        font-weight: 300;
        border-bottom: 1px solid #e0e0e0;
        background-color: #ffffff;
        margin-bottom: 40px;
      }

      .main-container {
        max-width: 800px;
        width: 90%;
        text-align: center;
        padding-bottom: 60px;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      p {
        font-size: 1rem;
        color: #666666;
        margin-bottom: 25px;
      }

      h2 {
        font-size: 1.2rem;
        font-weight: 450;
        letter-spacing: 1px;
        color: #111111;
        margin-bottom: 40px;
      }

      /* Contenedor del vídeo con estética editorial limpia */
      .video-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* Proporción 16:9 */
        height: 0;
        background-color: #000000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
      }

      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Enlace con estética de botón minimalista o texto subrayado */
      .video-link {
        margin-top: 20px;
      }

      .video-link a {
        color: #111111;
        text-decoration: none;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 1px solid #111111;
        padding-bottom: 2px;
        transition: opacity 0.3s ease;
      }

      .video-link a:hover {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>

    <!-- Cabecera de marca -->
    <header>
      Stradivarius
    </header>

    <div class="main-container">
      <h1>Hola, mundo</h1>
      <p>Este es el contenido visible de la página.</p>
      <h2>Fátima Rocha Perujo</h2>

      <!-- Vídeo incrustado de YouTube -->
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/xU3DYkuB5G8" 
          title="Reproductor de vídeo de YouTube" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>

      <!-- Enlace al vídeo con estilo editorial -->
      <div class="video-link">
        <a href="http://www.youtube.com/watch?v=xU3DYkuB5G8" target="_blank">Ver en YouTube: ¿Qué es la trata de personas?</a>
      </div>
    </div>

  </body>
</html>
